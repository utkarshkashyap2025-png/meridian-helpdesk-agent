<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="meridianGrad1" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B83EB"/>
      <stop offset="50%" stop-color="#5B5FC7"/>
      <stop offset="100%" stop-color="#3D3E8E"/>
    </linearGradient>
    <linearGradient id="meridianGrad2" x1="42" y1="6" x2="6" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36D1DC"/>
      <stop offset="100%" stop-color="#5B5FC7"/>
    </linearGradient>
    <filter id="meridianGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5B5FC7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Base Diamond Shield -->
  <rect x="5" y="5" width="38" height="38" rx="10" fill="url(#meridianGrad1)" filter="url(#meridianGlow)"/>
  <!-- Stylized Geometric "M" Meridian Wave -->
  <path d="M12 33V16L24 27L36 16V33" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Meridian Node -->
  <circle cx="24" cy="27" r="2.8" fill="#36D1DC"/>
  <!-- Orbit Ring Accent -->
  <ellipse cx="24" cy="24" rx="15" ry="5.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(-25 24 24)"/>
</svg>
